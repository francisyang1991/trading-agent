# Best balanced config from parameter sweep (ex-PLTR, hourly-picked stocks)
# z=3.2, vwap=35, sat=70%, cooldown=10, hold=6, max_tpd=8
# avg_alpha=0.38%, pct_pos=50%, avg_sharpe=2.14

ib_gateway:
  host: 127.0.0.1
  port: 4002
  client_id: 21
  readonly: false
  reconnect_delay: 5
  max_reconnect_attempts: 10
  heartbeat_interval: 30
  connection_timeout: 30
  requests_per_second: 45

runtime:
  timezone: US/Eastern
  loop_interval_seconds: 5
  signal_cooldown_seconds: 60
  force_flatten_time: "15:55"
  output_base_dir: outputs

watchlist:
  symbols:
    - AAPL
    - MSFT
    - NVDA

session_windows:
  reduce_only:
    - { start: "09:30", end: "10:00" }
  main:
    - { start: "10:00", end: "11:30" }
    - { start: "13:30", end: "15:00" }
  midday_half_size:
    - { start: "11:30", end: "13:30" }

strategy:
  min_bars_for_signal: 30
  zscore_entry_buy: -3.2
  zscore_entry_sell: 3.2
  zscore_exit_to_mean: 1.12
  rolling_std_window: 20
  atr_window: 14
  atr_stop_multiplier: 1.2

execution:
  order_type: limit
  limit_offset_bps: 3
  order_timeout_seconds: 20
  commission_bps: 1.0
  slippage_bps: 1.5

risk:
  core_target_pct: 0.80
  satellite_max_pct_of_core: 0.70
  risk_per_trade_pct: 0.01
  daily_loss_limit_pct: 0.02
  max_notional_per_trade_pct: 0.08
  min_trade_shares: 1

replay:
  min_bars_between_trades: 10
  min_hold_bars: 6
  max_trades_per_day: 8
  min_vwap_distance_bps: 35.0
  min_entry_rvol: 0.0
