# =============================================================================
# Three-Layer Stock Picker Configuration - RELAXED FOR BACKTESTING
# =============================================================================

# --- Data ingestion ---
data:
  period: "2y"
  batch_size: 200
  yf_threads: false
  max_symbols: 0

# --- Preflight cache quality gate ---
preflight:
  enabled: false

# --- Auto earnings-refresh gate ---
earnings_refresh:
  enabled: false

# --- Technical filter (Layer 1) ---
technical:
  rs_threshold: 70.0                # Relaxed from 80
  near_52w_ratio: 0.80              # Relaxed from 0.85
  min_bars: 130

# --- Fundamental filter (Layer 2) ---
fundamental:
  min_eps_yoy: 0.10                 # Relaxed from 0.25
  min_revenue_growth: 0.05          # Relaxed from 0.10
  min_revenue_acceleration: null
  require_surprise_non_negative: false

# --- Quality / Moat filter (Layer 3) ---
quality:
  min_roe: 0.05                     # Relaxed from 0.10
  min_gm_rank: 40.0                 # Relaxed from 60.0
  max_debt_to_equity: 1.5           # Relaxed from 1.2

# --- Composite scoring weights ---
scoring:
  rs_rank_weight: 0.35
  eps_yoy_weight: 0.20
  revenue_growth_weight: 0.20
  gm_rank_weight: 0.15
  roe_weight: 0.10

# --- Post-processing (diversification) ---
post_process:
  deduplicate_share_classes: true
  max_per_industry: 4               # Relaxed from 2
  top_n: 50                         # Output top 50 instead of 25

# --- Historical lookback ---
lookback:
  enabled: true
  months_back: [3, 6, 9, 12]
  refresh_snapshot_cache: false
  skip_missing_yoy_checks: true
  skip_in_downtrend: true   # Stay cash when SPY 6m momentum is sideways/downtrend

output:
  dir: "results/picker"
