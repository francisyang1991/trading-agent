# Intraday T+0 Paper Trading Configuration
# Connects to IBKR paper gateway on GCP VM via socat proxy
# Strategy params tuned from 30-day backtest (V3 iteration 5)

ib_gateway:
  host: "34.75.9.166"       # GCP trading-vm
  port: 4002                # direct to IB paper gateway
  client_id: 21
  readonly: false
  reconnect_delay: 5
  max_reconnect_attempts: 10
  heartbeat_interval: 30
  connection_timeout: 30
  requests_per_second: 45

runtime:
  timezone: "US/Eastern"
  loop_interval_seconds: 5
  signal_cooldown_seconds: 60
  force_flatten_time: "15:55"
  output_base_dir: "outputs"

watchlist:
  symbols:
    - "KLAC"     # +0.92% alpha, PF 3.52, Sharpe 4.82
    - "PLTR"     # +3.58% alpha, PF 1.60, best risk-adj
    - "MU"       # +3.06% alpha, PF 1.38
    - "AMD"      # +2.73% alpha
    - "ASML"     # +1.62% alpha, PF 2.23

session_windows:
  reduce_only:
    - { start: "09:30", end: "10:00" }
  main:
    - { start: "10:00", end: "11:30" }
    - { start: "13:30", end: "15:00" }
  midday_half_size:
    - { start: "11:30", end: "13:30" }

strategy:
  min_bars_for_signal: 30
  zscore_entry_buy: -2.5      # V3 tuned (was -2.0)
  zscore_entry_sell: 2.5      # V3 tuned (was 2.0)
  zscore_exit_to_mean: 0.5    # Hold until closer to VWAP
  rolling_std_window: 20
  atr_window: 14
  atr_stop_multiplier: 1.2

execution:
  order_type: "limit"
  limit_offset_bps: 3
  order_timeout_seconds: 20
  commission_per_share: 0.005
  commission_min_per_trade: 1.00
  commission_max_pct: 0.01
  slippage_bps: 1.5

risk:
  core_target_pct: 0.80
  satellite_max_pct_of_core: 0.75    # V3 tuned (was 0.50)
  risk_per_trade_pct: 0.03           # V3 tuned (was 0.01)
  daily_loss_limit_pct: 0.02
  max_notional_per_trade_pct: 0.25   # V3 tuned (was 0.08)
  min_trade_shares: 1

pdt:
  enforce_pdt_guard: true
  min_equity_for_unlimited_daytrade: 25000
  max_day_trades_under_25k: 3

reporting:
  write_signals_csv: true
  write_trades_csv: true
  write_metrics_csv: true
  write_daily_report: true

replay:
  min_bars_between_trades: 6
  min_hold_bars: 5
  max_trades_per_day: 6
  min_vwap_distance_bps: 50.0
  max_entry_legs: 1
