execution:
  commission_bps: 1.0
  limit_offset_bps: 3
  order_timeout_seconds: 20
  order_type: limit
  slippage_bps: 1.5
ib_gateway:
  client_id: 21
  connection_timeout: 30
  heartbeat_interval: 30
  host: 127.0.0.1
  max_reconnect_attempts: 10
  port: 4002
  readonly: false
  reconnect_delay: 5
  requests_per_second: 45
pdt:
  enforce_pdt_guard: true
  max_day_trades_under_25k: 3
  min_equity_for_unlimited_daytrade: 25000
replay:
  max_trades_per_day: 8
  min_bars_between_trades: 10
  min_entry_rvol: 1.0
  min_hold_bars: 6
  min_vwap_distance_bps: 55.0
reporting:
  write_daily_report: true
  write_metrics_csv: true
  write_signals_csv: true
  write_trades_csv: true
risk:
  core_target_pct: 0.8
  daily_loss_limit_pct: 0.02
  max_notional_per_trade_pct: 0.08
  min_trade_shares: 1
  risk_per_trade_pct: 0.01
  satellite_max_pct_of_core: 0.3
runtime:
  force_flatten_time: '15:55'
  loop_interval_seconds: 5
  output_base_dir: outputs
  signal_cooldown_seconds: 60
  timezone: US/Eastern
session_windows:
  main:
  - end: '11:30'
    start: '10:00'
  - end: '15:00'
    start: '13:30'
  midday_half_size:
  - end: '13:30'
    start: '11:30'
  reduce_only:
  - end: '10:00'
    start: 09:30
strategy:
  atr_stop_multiplier: 1.2
  atr_window: 14
  min_bars_for_signal: 30
  rolling_std_window: 20
  zscore_entry_buy: -2.4
  zscore_entry_sell: 2.4
  zscore_exit_to_mean: 1.0
watchlist:
  symbols:
  - AAPL
  - MSFT
  - NVDA
