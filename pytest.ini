[pytest]
# Test markers for tiered test execution
markers =
    unit: Pure logic tests with no external dependencies (Tier 1)
    integration: Tests with mocked external dependencies (Tier 2)
    bot: Discord bot utility tests with mocked Discord (Tier 3)
    e2e: End-to-end tests requiring live connections
    slow: Tests that take >10 seconds

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    --timeout=60
    --ignore=tests/unit/test_core.py
    --ignore=tests/unit/test_picker

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeout (seconds) - prevent infinite hangs
timeout = 60

# Async mode for pytest-asyncio
asyncio_mode = auto
